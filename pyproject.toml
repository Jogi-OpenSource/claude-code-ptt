[project]
name = "claude-code-ptt"
version = "0.1.0"
description = "Push-to-talk for Claude Code on Windows: global hotkey, local Whisper, spoken replies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "edge-tts>=6.1",
    "mcp>=1.2,<2",
    "pycaw>=20230407",
    "comtypes>=1.2",
]

[project.scripts]
claude-code-ptt = "claude_code_ptt.cli:main"
claude-code-ptt-mcp = "claude_code_ptt.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_code_ptt*"]
